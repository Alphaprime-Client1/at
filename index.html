   TIC TAC TOE GAME
===================================== */

const cells = document.querySelectorAll(".cell");

const message = document.getElementById("message");

let game = Array(9).fill("");

let gameOver = false;

let sruthiScore = 0;

let youScore = 0;


/* WINNING PATTERNS */

const winningPatterns = [

    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],

    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],

    [0, 4, 8],
    [2, 4, 6]

];


/* USER MOVE */

cells.forEach((cell, index) => {

    cell.addEventListener("click", function() {

        if (gameOver || game[index] !== "") {
            return;
        }

        game[index] = "X";

        cell.textContent = "X";

        cell.classList.add("x");


        if (checkWinner("X")) {

            youScore++;

            updateScore();

            message.textContent = "You won! Impossible! 😂";

            gameOver = true;

            return;
        }


        if (checkDraw()) {

            message.textContent = "Draw! Try again.";

            gameOver = true;

            return;
        }


        message.textContent = "Sruthi is thinking... ❤️";

        setTimeout(computerMove, 500);

    });

});


/* COMPUTER MOVE */

function computerMove() {

    if (gameOver) return;

    const available = game
        .map((value, index) => value === "" ? index : null)
        .filter(value => value !== null);


    if (available.length === 0) return;


    const randomIndex = Math.floor(
        Math.random() * available.length
    );

    const position = available[randomIndex];


    game[position] = "♥";

    cells[position].textContent = "♥";

    cells[position].classList.add("heart");


    if (checkWinner("♥")) {

        sruthiScore++;

        updateScore();

        message.textContent = "Sruthi wins! Told you! ❤️";

        gameOver = true;

        return;
    }


    if (checkDraw()) {

        message.textContent = "Draw! Try again.";

        gameOver = true;

        return;
    }


    message.textContent = "Your turn. Don't disappoint!";

}


/* CHECK WINNER */

function checkWinner(player) {

    return winningPatterns.some(pattern => {

        return pattern.every(index => game[index] === player);

    });

}


/* CHECK DRAW */

function checkDraw() {

    return game.every(value => value !== "");

}


/* UPDATE SCORE */

function updateScore() {

    document.getElementById("sruthiScore").textContent =
        sruthiScore;

    document.getElementById("youScore").textContent =
        youScore;

}


/* RESET GAME */

function resetGame() {

    game = Array(9).fill("");

    gameOver = false;

    cells.forEach(cell => {

        cell.textContent = "";

        cell.className = "cell";

    });

    message.textContent = "Play again. Good luck! ❤️";

}


/* HOME BUTTON */

function goHome() {

    message.textContent =
        "Home is not available. You're stuck here! 😂";

}
